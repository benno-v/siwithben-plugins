name: Feedback or problem
description: Tell us what worked, what didn't, or what you'd like added.
labels: ["feedback"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options: [pm-status-report, pm-toolkit, Other / new idea]
    validations: { required: true }
  - type: dropdown
    id: app
    attributes:
      label: Where were you using it?
      options: [Claude Cowork, Claude Code, Claude chat (web/desktop), Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, or what would you like?
      description: Please remove any confidential project or client details.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead? (optional)
